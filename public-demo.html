<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Executive Dashboard — Public Demo</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="dashboard" src="index.html" title="Executive Dashboard public demo"></iframe>
<script>
const replacements=[
 [/Tangerine/gi,'Northstar Bank'],
 [/Scotiabank/gi,'Northstar Bank'],
 [/VISA\s*OCT/gi,'Instant Transfer'],
 [/Visa Direct/gi,'Instant Transfer Network'],
 [/Payments Canada/gi,'National Payments Network'],
 [/Real[- ]Time Rail/gi,'Real-Time Payments'],
 [/\bRTR\b/g,'RTP'],
 [/Send and Receive\s*3\.6/gi,'Send & Receive Release A'],
 [/Send and Receive\s*3\.7/gi,'Send & Receive Release B'],
 [/Send\s*&\s*Receive\s*3\.6/gi,'Send & Receive Release A'],
 [/Send\s*&\s*Receive\s*3\.7/gi,'Send & Receive Release B'],
 [/RTR Butler/gi,'Payments Copilot']
];
function cleanString(value){let out=String(value??'');for(const [pattern,replacement] of replacements)out=out.replace(pattern,replacement);return out;}
function sanitize(root){
 const doc=root.nodeType===9?root:root.ownerDocument;
 const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{const v=cleanString(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
 root.querySelectorAll?.('input,textarea,option,[title],[aria-label],[data-name],[data-title]').forEach(el=>{
   if('value' in el && typeof el.value==='string')el.value=cleanString(el.value);
   ['title','aria-label','data-name','data-title'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,cleanString(el.getAttribute(a)));});
 });
}
function buildExportHtml(doc){
 sanitize(doc);
 const clone=doc.documentElement.cloneNode(true);
 clone.querySelectorAll('script').forEach(el=>el.remove());
 clone.querySelector('#v-edit')?.remove();
 clone.querySelectorAll('.tab-grp').forEach(el=>el.remove());
 clone.querySelectorAll('button').forEach(btn=>{
   const txt=(btn.textContent||'').trim().toLowerCase();
   if(txt.includes('edit')||txt.includes('share')||txt.includes('print'))btn.remove();
 });
 clone.querySelectorAll('input,textarea,select').forEach(el=>{
   const replacement=doc.createElement('div');
   replacement.textContent=el.value||'';
   replacement.style.whiteSpace='pre-wrap';
   replacement.style.padding='7px 11px';
   replacement.style.border='1px solid #e2e8f0';
   replacement.style.borderRadius='7px';
   replacement.style.background='#fafbfc';
   el.replaceWith(replacement);
 });
 const exportStyle=doc.createElement('style');
 exportStyle.textContent='body{background:#f1f5f9!important}.view{display:block!important}#v-roadmap,#v-program{margin-top:28px;padding-top:28px;border-top:2px solid #e2e8f0}@media print{#hdr{display:none!important}#v-roadmap,#v-program{break-before:page;page-break-before:always;margin-top:0;padding-top:0;border-top:0}}';
 clone.querySelector('head')?.appendChild(exportStyle);
 const title=clone.querySelector('title');if(title)title.textContent='Executive Dashboard — Public Demo';
 return '<!doctype html>\n'+clone.outerHTML;
}
function installExportOverride(frame){
 const win=frame.contentWindow,doc=frame.contentDocument;
 if(!win||!doc)return;
 win.shareExport=function(){
   try{
     const html=buildExportHtml(doc);
     const blob=new Blob([html],{type:'text/html;charset=utf-8'});
     const url=URL.createObjectURL(blob);
     const a=doc.createElement('a');
     a.href=url;
     a.download='executive-dashboard-demo.html';
     doc.body.appendChild(a);
     a.click();
     a.remove();
     setTimeout(()=>URL.revokeObjectURL(url),1500);
     if(typeof win.toast==='function')win.toast('📥 Dashboard exported');
   }catch(err){
     console.error('Export failed',err);
     alert('Unable to export the dashboard. Please try again.');
   }
 };
}
const frame=document.getElementById('dashboard');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 if(!doc)return;
 sanitize(doc);
 doc.title='Executive Dashboard — Public Demo';
 installExportOverride(frame);
 const observer=new MutationObserver(mutations=>mutations.forEach(m=>{
   if(m.type==='characterData'){const v=cleanString(m.target.nodeValue);if(v!==m.target.nodeValue)m.target.nodeValue=v;}
   m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===9)sanitize(n);else if(n.nodeType===3)n.nodeValue=cleanString(n.nodeValue);});
 }));
 observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});
 doc.addEventListener('input',e=>{if(e.target&&'value' in e.target)e.target.value=cleanString(e.target.value);},true);
});
</script>
</body>
</html>
